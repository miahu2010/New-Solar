<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>动态柔和尘埃粒子太阳系</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469654/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.17"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; }
        #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        /* 摄像头视频流，隐藏但在后台运行用于 MediaPipe */
        #video-feed { position: absolute; visibility: hidden; }
        /* UI 颜色选择器和全屏按钮 */
        #ui-panel { position: absolute; top: 10px; right: 10px; z-index: 10; color: white; }
        #fullscreen-btn { padding: 10px; cursor: pointer; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 5px; }
    </style>
</head>
<body>
    <div id="container"></div>
    <video id="video-feed" autoplay playsinline></video>
    
    <div id="ui-panel">
        <button id="fullscreen-btn">全屏</button>
    </div>

    <script id="vertexshader" type="x-shader/x-vertex">
        precision highp float;

        attribute float size;
        attribute vec3 customColor;
        attribute vec3 offset; // 用于轻微噪声扰动
        attribute float starMagnitude; // 星等属性，用于颜色和大小

        uniform float time;
        uniform float pointScale;
        uniform float handScaleFactor; // 手势控制的缩放因子
        uniform float handOffsetX; // 手势控制的 X 轴偏移

        varying vec3 vColor;
        varying float vCenterDistance;

        // 简化的 Perlin 噪声函数 (在实际项目中应引入完整的 GLSL 噪声库)
        float noise(vec3 p) {
            return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453);
        }

        void main() {
            vColor = customColor;

            // 1. 噪声扰动 (漂浮/呼吸)
            float noiseFactor = noise(position * 0.1 + time * 0.5) * 0.2; 
            vec3 particleOffset = offset * noiseFactor * 0.5;
            
            // 2. 空间感漂浮偏移 (每帧累加)
            vec3 finalPosition = position + particleOffset;

            // 3. 手势控制：缩放与平移
            finalPosition *= handScaleFactor;
            finalPosition.x += handOffsetX;

            // 计算粒子的最终位置
            vec4 mvPosition = modelViewMatrix * vec4(finalPosition, 1.0);
            
            // 设置点的大小 (size * 视口缩放)
            // 根据星等调整基础大小
            gl_PointSize = size * (1.0 + starMagnitude * 0.5) * (pointScale / -mvPosition.z);

            // 计算到粒子中心距离，用于 Fragment Shader 的径向衰减
            vCenterDistance = length(gl_PointCoord - vec2(0.5));
            
            // 4. 应用轻微的 噪声扰动（让粒子漂浮、呼吸）
            // 在这里加入进一步的、基于时间的微小抖动
            mvPosition.xyz += (noise(vCenterDistance + time) - 0.5) * 0.05;

            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script id="fragmentshader" type="x-shader/x-fragment">
        precision highp float;

        uniform float time;
        uniform vec3 uColor;

        varying vec3 vColor;
        varying float vCenterDistance; // 0.0 (中心) 到 0.5 (边缘)

        void main() {
            // 1. 柔和发光核 (径向衰减)
            // vCenterDistance 范围是 0.0 到 0.5 (对于圆点)，这里使用 length(gl_PointCoord - 0.5) 效果更好
            float radius = vCenterDistance; 
            
            // 衰减曲线：使用平滑步 (smoothstep) 实现柔和边缘
            float alpha = 1.0 - smoothstep(0.0, 0.45, radius); // 0.45 决定了核的大小

            // 2. Fresnel 光晕效果 (简化：基于中心距离的强度增强)
            // 边缘 alpha 虽小，但颜色强度增强
            float fresnel = pow(radius, 3.0); 

            // 3. 基于时间的随机闪烁
            // 确保闪烁是在低频和低振幅内
            float flicker = 0.9 + 0.1 * sin(time * 5.0 + vCenterDistance * 10.0);
            
            // 4. 最终颜色
            // 初始颜色要求明度不要太高，因此将 VColor 乘以一个较小的因子
            vec3 baseColor = vColor * 0.5; // 降低明度

            // 组合颜色：基础色 + Fresnel 光晕增强
            vec3 finalColor = baseColor * (1.0 + fresnel * 0.5) * flicker;

            // 5. 最终输出 (THREE.AdditiveBlending)
            // 粒子纹理将变为更柔和的径向发光核
            // AdditiveBlending 会让 alpha 叠加，所以 alpha 不宜过高
            gl_FragColor = vec4(finalColor, alpha * 0.5); 
        }
    </script>

    <script>
        // --- 全局变量 ---
        let scene, camera, renderer, particles, controls;
        let video, hands;
        let handScaleFactor = 1.0; // 手势缩放因子
        let handOffsetX = 0.0; // 手势 X 轴偏移
        const particleCount = 50000; 

        // --- 初始化 Three.js 场景 ---
        function initScene() {
            const container = document.getElementById('container');
            
            // 场景
            scene = new THREE.Scene();
            
            // 摄像机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.z = 500;
            
            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // 适配移动端高分屏
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 粒子系统
            createSolarSystemParticles();

            // UI 和事件
            setupUI();

            // 窗口尺寸变化监听
            window.addEventListener('resize', onWindowResize, false);

            // 启动手势识别
            initMediaPipe();

            // 启动动画循环
            animate();
        }

        // --- 太阳系粒子系统创建 ---
        function createSolarSystemParticles() {
            // 1. 几何体和属性 (Attributes)
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const sizes = [];
            const colors = [];
            const offsets = []; // 噪声扰动偏移
            const magnitudes = []; // 星等/亮度

            // 初始颜色 (低明度星空蓝)
            const initialColor = new THREE.Color(0.2, 0.4, 0.8);
            const tempColor = new THREE.Color();

            // 生成粒子数据
            for (let i = 0; i < particleCount; i++) {
                // 模拟太阳系分布：更密集的中心和稀疏的外围
                const distance = Math.pow(Math.random(), 3) * 1000; // 0 到 1000 范围，向中心偏斜
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1); // 球形分布

                const x = distance * Math.sin(phi) * Math.cos(theta);
                const y = distance * Math.sin(phi) * Math.sin(theta);
                const z = distance * Math.cos(phi);

                positions.push(x, y, z);
                
                // 粒子尺寸和星等
                const size = Math.random() * 10 + 5; 
                sizes.push(size);
                
                // 星等 (Mag): 模拟行星亮度。0 (亮) 到 1 (暗)
                const magnitude = Math.random(); 
                magnitudes.push(magnitude);

                // 颜色 (根据星等调整颜色，保持低明度)
                tempColor.copy(initialColor).multiplyScalar(1.0 - magnitude * 0.5); // 星等越大，颜色越暗淡
                colors.push(tempColor.r, tempColor.g, tempColor.b);

                // 随机偏移向量用于噪声扰动
                offsets.push(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('offset', new THREE.Float32BufferAttribute(offsets, 3));
            geometry.setAttribute('starMagnitude', new THREE.Float32BufferAttribute(magnitudes, 1));


            // 2. 着色器材质 (ShaderMaterial)
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0.0 },
                    pointScale: { value: window.innerHeight * 0.5 },
                    uColor: { value: initialColor },
                    handScaleFactor: { value: handScaleFactor },
                    handOffsetX: { value: handOffsetX },
                },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending, // 关键：实现通透叠加发光效果
                depthTest: true,
                depthWrite: false, // 提高性能
                transparent: true,
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // TODO: 添加细致的行星轨道 LineSegments 
            // TODO: 添加可选择的行星模型粒子群
        }

        // --- MediaPipe Hands 初始化 ---
        async function initMediaPipe() {
            video = document.getElementById('video-feed');
            
            // 获取摄像头权限
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 'video': true });
                video.srcObject = stream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = resolve;
                });
                video.play();
                
                hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469654/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                hands.onResults(onResults);
                
                // 开始不断处理视频帧
                const sendFrame = async () => {
                    if (video.readyState >= 2) { // READY_STATE_HAVE_CURRENT_DATA
                        await hands.send({ image: video });
                    }
                    requestAnimationFrame(sendFrame);
                };
                requestAnimationFrame(sendFrame);

            } catch (error) {
                console.error("无法访问摄像头: ", error);
            }
        }

        // --- 手势识别结果处理 ---
        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // TODO: 
                // 1. **检测双手张合 (缩放/扩散)**: 计算两只手腕 (wrist) 或中心点之间的距离。
                // 2. **检测整体左右移动 (平移)**: 计算两手中心点 X 坐标的平均值与前一帧的差值。
                // 3. **检测握拳/张开 (放大/缩小)**: 基于手指关键点的角度或距离判断手势。

                // --- 示例手势逻辑 (需要您根据 MediaPipe 关键点实现) ---
                const landmarks = results.multiHandLandmarks;
                
                let currentScaleFactor = 1.0;
                let currentOffsetX = 0.0;
                
                if (landmarks.length === 2) {
                    // 示例：基于双手距离进行缩放
                    const hand1Wrist = landmarks[0][0];
                    const hand2Wrist = landmarks[1][0];
                    
                    const distanceX = Math.abs(hand1Wrist.x - hand2Wrist.x);
                    
                    // 距离越近，粒子越放大 (握拳放大)；距离越远，粒子越缩小 (张开缩小)
                    // 这是一个简化的映射，需要根据实际应用场景调整
                    currentScaleFactor = 1.0 + (0.5 - distanceX) * 2.0; 
                    currentScaleFactor = THREE.MathUtils.clamp(currentScaleFactor, 0.5, 2.0); // 限制缩放范围
                    
                    // 示例：基于双手中心点进行 X 轴平移
                    const centerMidx = (hand1Wrist.x + hand2Wrist.x) / 2;
                    // 将 0-1 映射到 Three.js 坐标 (-200 到 200)
                    currentOffsetX = (centerMidx - 0.5) * -400; 

                } else if (landmarks.length === 1) {
                    // 单手逻辑：例如，握拳放大，张开缩小
                    // 假设：如果所有指尖 (8, 12, 16, 20) 到掌根 (0) 的距离都小于某个阈值，则视为握拳
                    // TODO: 实现握拳检测
                    // currentScaleFactor = isFist ? 1.5 : 0.8;
                }

                // 平滑过渡
                handScaleFactor = THREE.MathUtils.lerp(handScaleFactor, currentScaleFactor, 0.1);
                handOffsetX = THREE.MathUtils.lerp(handOffsetX, currentOffsetX, 0.1);

                // 更新 Shader Uniforms
                particles.material.uniforms.handScaleFactor.value = handScaleFactor;
                particles.material.uniforms.handOffsetX.value = handOffsetX;
            }
        }

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001;
            particles.material.uniforms.time.value = time;

            // 轻微自转，增强空间感
            particles.rotation.y = time * 0.01;
            particles.rotation.x = time * 0.005;

            renderer.render(scene, camera);
        }

        // --- UI 设置 ---
        function setupUI() {
            // 全屏按钮
            document.getElementById('fullscreen-btn').addEventListener('click', () => {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) { // Firefox
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.webkitRequestFullscreen) { // Chrome, Safari and Opera
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) { // IE/Edge
                    document.documentElement.msRequestFullscreen();
                }
            });

            // lil-gui (颜色选择器)
            const gui = new lil.GUI({ container: document.getElementById('ui-panel') });
            const params = {
                particleColor: particles.material.uniforms.uColor.value.getHex(),
                density: 50000,
            };

            gui.addColor(params, 'particleColor').onChange(value => {
                particles.material.uniforms.uColor.value.set(value);
            }).name('粒子基色');
            
            gui.add(particles.material, 'opacity', 0.1, 1.0).name('通透度');
        }


        // --- 窗口重置 ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            particles.material.uniforms.pointScale.value = window.innerHeight * 0.5;
        }

        // 启动应用
        initScene();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Solar Dust - Interactive Particle System</title>
    <style>
        :root {
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
            --text: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* Deep Space Black */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 1;
        }

        /* 隐藏的视频元素，用于MediaPipe处理 */
        #input-video {
            position: absolute;
            width: 320px;
            height: 240px;
            top: -1000px; /* Hide offscreen */
            left: 0;
            z-index: 0;
        }

        /* UI 容器 */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 280px;
            pointer-events: none; /* 让鼠标穿透到下方 */
        }

        /* 磨砂玻璃面板 */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            pointer-events: auto;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 15px 0;
            color: rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.8);
        }

        /* 行星选择按钮 */
        .planet-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            margin: 2px;
            transition: all 0.2s;
            display: inline-block;
        }

        .planet-btn:hover, .planet-btn.active {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }

        /* 颜色选择器 */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 30px;
            border-radius: 8px;
            background: none;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0; 
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--glass-border);
            border-radius: 8px;
        }

        /* 摄像头状态指示 */
        #cam-status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff4b4b;
        }
        .status-dot.active {
            background-color: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        /* 全屏按钮 */
        #fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 启动遮罩 */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }
        
        #start-btn {
            background: white;
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        #start-btn:hover { transform: scale(1.05); }

        /* Loading */
        .loader {
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="overlay">
        <h2 style="font-weight: 300; letter-spacing: 4px; margin-bottom: 10px;">SOLAR DUST</h2>
        <p style="color: #666; font-size: 12px; max-width: 300px; text-align: center;">允许摄像头访问以启用手势控制<br>双指缩放 · 挥手旋转 · 握拳聚焦</p>
        <button id="start-btn">开启星际探索</button>
        <div class="loader" id="loader"></div>
    </div>

    <div id="ui-container">
        <div class="glass-panel">
            <h1>控制中心</h1>
            
            <div class="control-group">
                <label>目标天体</label>
                <div id="planet-list">
                    </div>
            </div>

            <div class="control-group">
                <label>粒子颜色 (覆盖默认)</label>
                <input type="color" id="particle-color" value="#ffffff">
            </div>

            <div class="control-group">
                <label style="color:rgba(255,255,255,0.4); font-size: 10px; margin-top:10px;">
                    状态: <span id="gesture-debug">等待手势...</span>
                </label>
            </div>
        </div>
    </div>

    <button id="fullscreen-btn">⛶</button>
    
    <div id="cam-status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">摄像头未激活</span>
    </div>

    <video id="input-video"></video>
    <div id="canvas-container"></div>

    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size;
        attribute float shift;
        uniform float uTime;
        uniform float uScale; // 握拳控制的大小
        varying vec3 vColor;
        
        void main() {
            vColor = color;
            vec3 p = position;
            
            // 简单的波动效果，不粘连，模拟尘埃浮动
            p.x += sin(uTime * 0.5 + shift) * 0.5;
            p.y += cos(uTime * 0.3 + shift) * 0.5;
            p.z += sin(uTime * 0.2 + shift * 2.0) * 0.2;

            vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
            
            // 距离衰减公式，让远处的粒子变小
            gl_PointSize = (size * uScale) * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
        uniform sampler2D pointTexture;
        uniform vec3 uOverrideColor;
        uniform float uUseOverride; // 0.0 or 1.0
        
        varying vec3 vColor;
        
        void main() {
            // 圆形裁剪
            vec2 coord = gl_PointCoord - vec2(0.5);
            if(length(coord) > 0.5) discard;

            vec3 finalColor = mix(vColor, uOverrideColor, uUseOverride);
            
            // 柔和边缘
            float alpha = 1.0 - smoothstep(0.3, 0.5, length(coord));
            
            gl_FragColor = vec4(finalColor, alpha * 0.8); // 0.8 opacity for soft look
        }
    </script>

    <script>
        // --- Configuration ---
        const CONFIG = {
            particleCount: 4000, // 每个星球的粒子数
            orbitColor: 0x333333,
            bgColor: 0x050505
        };

        // --- Solar System Data (Stylized for Visuals, not strictly to scale) ---
        // 明度调整：为了不丑，颜色偏灰度/低饱和
        const PLANETS = [
            { name: "Sun", color: new THREE.Color('#FFD700'), radius: 10, distance: 0, speed: 0 },
            { name: "Mercury", color: new THREE.Color('#A5A5A5'), radius: 2, distance: 20, speed: 0.02 },
            { name: "Venus", color: new THREE.Color('#E3BB76'), radius: 3.5, distance: 30, speed: 0.015 },
            { name: "Earth", color: new THREE.Color('#4B70DD'), radius: 3.8, distance: 45, speed: 0.01 },
            { name: "Mars", color: new THREE.Color('#D1684E'), radius: 2.5, distance: 60, speed: 0.008 },
            { name: "Jupiter", color: new THREE.Color('#CFA474'), radius: 8, distance: 85, speed: 0.005 },
            { name: "Saturn", color: new THREE.Color('#DFCE9F'), radius: 7, distance: 110, speed: 0.004 },
            { name: "Uranus", color: new THREE.Color('#93B8BE'), radius: 5, distance: 135, speed: 0.003 },
            { name: "Neptune", color: new THREE.Color('#5E7898'), radius: 5, distance: 155, speed: 0.002 }
        ];

        // --- Global Variables ---
        let scene, camera, renderer, particlesMesh, orbitLines;
        let uniforms;
        let targetRotationY = 0;
        let targetZoom = 150;
        let targetParticleScale = 1.0;
        let isFist = false;
        let activePlanetIndex = -1; // -1 means overview

        // Interaction State
        const handState = {
            x: 0, // Normalized 0-1
            y: 0,
            distance: 0, // Between hands
            isTracking: false
        };

        // --- Initialization ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(CONFIG.bgColor, 0.002);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 40, 150);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(CONFIG.bgColor);
            container.appendChild(renderer.domElement);

            // Build System
            buildSolarSystem();
            buildOrbits();
            setupUI();

            // Resize Event
            window.addEventListener('resize', onWindowResize, false);
            
            // Fullscreen
            document.getElementById('fullscreen-btn').addEventListener('click', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else if (document.exitFullscreen) document.exitFullscreen();
            });

            animate();
        }

        // --- Particle System Generation ---
        function buildSolarSystem() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            const shifts = []; // Random shift for shader animation

            PLANETS.forEach((planet, index) => {
                const count = planet.name === 'Sun' ? CONFIG.particleCount * 2 : CONFIG.particleCount;
                
                for (let i = 0; i < count; i++) {
                    // Create sphere distribution
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(Math.random() * 2 - 1);
                    
                    // Surface distribution with volume softness
                    const r = planet.radius * (0.8 + Math.random() * 0.4); 

                    const x = r * Math.sin(phi) * Math.cos(theta);
                    const y = r * Math.sin(phi) * Math.sin(theta);
                    const z = r * Math.cos(phi);

                    // Add orbital offset
                    // We start them all aligned for simplicity, but in animation we rotate the container
                    positions.push(x + planet.distance, y, z); // Initial x offset by distance

                    // Color
                    colors.push(planet.color.r, planet.color.g, planet.color.b);

                    // Size (Dusty feel = varied sizes)
                    sizes.push(Math.random() * 2.5);

                    shifts.push(Math.random() * 100);
                }
            });

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            geometry.setAttribute('shift', new THREE.Float32BufferAttribute(shifts, 1));

            // Shader Material
            uniforms = {
                uTime: { value: 0 },
                uScale: { value: 1.0 },
                pointTexture: { value: createSoftTexture() },
                uOverrideColor: { value: new THREE.Color(0xffffff) },
                uUseOverride: { value: 0.0 }
            };

            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true,
                vertexColors: true
            });

            particlesMesh = new THREE.Points(geometry, material);
            scene.add(particlesMesh);
        }

        // --- Orbit Lines ---
        function buildOrbits() {
            orbitLines = new THREE.Group();
            PLANETS.forEach(planet => {
                if (planet.distance === 0) return;
                
                const points = [];
                // High segment count for smooth circles
                for (let i = 0; i <= 128; i++) {
                    const angle = (i / 128) * Math.PI * 2;
                    points.push(new THREE.Vector3(Math.cos(angle) * planet.distance, 0, Math.sin(angle) * planet.distance));
                }
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ 
                    color: 0xffffff, 
                    transparent: true, 
                    opacity: 0.05 // Very faint, elegant
                });
                const line = new THREE.Line(geometry, material);
                orbitLines.add(line);
            });
            scene.add(orbitLines);
        }

        // --- Utils ---
        function createSoftTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001;
            uniforms.uTime.value = time;

            // 1. Gesture Smoothing Logic
            // Rotate Scene based on hand X position
            if (handState.isTracking) {
                // Map hand x (0-1) to rotation (-PI to PI)
                // Invert direction for "Paddle" feel: Moving hand left rotates scene right
                const targetRot = (handState.x - 0.5) * 4; 
                targetRotationY += (targetRot - targetRotationY) * 0.05;

                // Zoom based on hand distance (spread)
                // Default distance approx 0.2-0.4. Map to zoom 50-250
                if (handState.distance > 0) {
                     // Normalize distance roughly 0.1 to 0.6
                     let d = Math.max(0.1, Math.min(handState.distance, 0.6));
                     let zoomLevel = 300 - (d * 400); // Spread hands = Closer (smaller z)
                     targetZoom += (zoomLevel - targetZoom) * 0.05;
                }

                // Fist Logic
                const scaleTarget = isFist ? 2.5 : 1.0;
                targetParticleScale += (scaleTarget - targetParticleScale) * 0.1;
            } else {
                // Auto rotate slowly if no hands
                targetRotationY += 0.001;
                // Revert to overview zoom
                targetZoom += (150 - targetZoom) * 0.02;
                targetParticleScale += (1.0 - targetParticleScale) * 0.1;
            }

            // Apply Camera Transforms
            // Smooth dampening
            scene.rotation.y = targetRotationY;
            camera.position.z = Math.max(20, targetZoom); // Clamp close zoom
            camera.lookAt(scene.position);

            // Apply Uniforms
            uniforms.uScale.value = targetParticleScale;

            // Optional: Rotate Orbit Lines separately or with scene
            // Here we keep them static relative to planets for simplicity, but maybe subtle wobble

            renderer.render(scene, camera);
        }

        // --- UI Setup ---
        function setupUI() {
            const list = document.getElementById('planet-list');
            
            // Add "Overview"
            const btnAll = document.createElement('div');
            btnAll.className = 'planet-btn active';
            btnAll.innerText = 'All System';
            btnAll.onclick = () => { selectPlanet(-1, btnAll); };
            list.appendChild(btnAll);

            PLANETS.forEach((p, i) => {
                const btn = document.createElement('div');
                btn.className = 'planet-btn';
                btn.innerText = p.name;
                btn.onclick = () => { selectPlanet(i, btn); };
                list.appendChild(btn);
            });

            // Color Picker
            document.getElementById('particle-color').addEventListener('input', (e) => {
                const color = new THREE.Color(e.target.value);
                uniforms.uOverrideColor.value = color;
                uniforms.uUseOverride.value = 1.0;
            });
        }

        function selectPlanet(index, btnElement) {
            activePlanetIndex = index;
            document.querySelectorAll('.planet-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            
            // Note: In this specific particle system structure (single geometry), 
            // focusing on a specific planet strictly via geometry is complex.
            // For this demo, we simply reset the view. 
            // A more complex version would compute the offset of that specific planet's particles.
            if(index === -1) {
                uniforms.uUseOverride.value = 0.0; // Reset color
            }
        }

        // --- MediaPipe Hands Setup ---
        const videoElement = document.getElementById('input-video');
        const startBtn = document.getElementById('start-btn');
        const loader = document.getElementById('loader');
        const overlay = document.getElementById('overlay');
        const debugText = document.getElementById('gesture-debug');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            loader.style.display = 'block';
            startCamera();
        });

        function onResults(results) {
            handState.isTracking = false;
            isFist = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handState.isTracking = true;
                statusDot.classList.add('active');
                statusText.innerText = "手势控制中";

                const landmarks1 = results.multiHandLandmarks[0];
                
                // 1. Calculate Center X (for Rotation)
                // Use wrist (0)
                let avgX = landmarks1[0].x;

                // 2. Dual Hand Logic (Zoom/Diffusion)
                if (results.multiHandLandmarks.length === 2) {
                    const landmarks2 = results.multiHandLandmarks[1];
                    const x1 = landmarks1[0].x;
                    const y1 = landmarks1[0].y;
                    const x2 = landmarks2[0].x;
                    const y2 = landmarks2[0].y;

                    // Distance
                    const dist = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                    handState.distance = dist;
                    avgX = (x1 + x2) / 2;
                    
                    debugText.innerText = `双手指控: 距离 ${(dist).toFixed(2)}`;
                } else {
                    // Single Hand
                    handState.distance = 0; // No zoom change
                    debugText.innerText = `单手指控: 水平 ${avgX.toFixed(2)}`;
                }

                // Reverse X because webcam is mirrored usually, but MediaPipe outputs normalized coordinates
                // Let's assume natural mirroring: Moving hand right on screen (your left)
                handState.x = 1.0 - avgX; 

                // 3. Fist Detection (Simple Heuristic)
                // Check if finger tips are below finger PIP joints (curled)
                // Index finger tip (8) vs pip (6)
                // Only checking first hand for simplicity
                const tip8 = landmarks1[8].y;
                const pip6 = landmarks1[6].y;
                const tip12 = landmarks1[12].y;
                const pip10 = landmarks1[10].y;
                
                // If tips are lower (y is higher) than PIP joints, roughly a fist
                // Note: Y increases downwards
                if (tip8 > pip6 && tip12 > pip10) {
                    isFist = true;
                    debugText.innerText += " | 状态: 握拳 (聚焦)";
                } else {
                    debugText.innerText += " | 状态: 张开";
                }

            } else {
                statusDot.classList.remove('active');
                statusText.innerText = "未检测到双手";
                debugText.innerText = "等待手势...";
            }
        }

        function startCamera() {
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});
            
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 320,
                height: 240
            });

            cameraUtils.start()
                .then(() => {
                    init(); // Init 3D scene after camera is ready (optional logic)
                    overlay.style.opacity = 0;
                    setTimeout(() => overlay.style.display = 'none', 500);
                })
                .catch(err => {
                    console.error(err);
                    alert("无法启动摄像头，请确保允许权限并使用HTTPS/Localhost");
                    loader.style.display = 'none';
                    startBtn.style.display = 'block';
                });
        }
        
        // Auto init just to show something if camera fails or before click? 
        // No, wait for user.
        
    </script>
</body>
</html>
